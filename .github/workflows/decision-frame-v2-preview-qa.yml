name: Launch preview QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/decision-frame-v2-preview-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-preview-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Astro preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/greensquare-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/greensquare-preview.log
          exit 1

      - name: Responsive launch regression
        run: |
          mkdir -p qa/launch
          cat > qa/launch/run.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:4321';
          const routes = ['/', '/decision-frame/', '/benchmark/', '/product/'];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'tablet', width: 820, height: 1180 },
            { name: 'mobile', width: 390, height: 844 },
          ];
          const output = 'qa/launch';
          const browser = await chromium.launch();
          const results = [];
          let failed = false;

          for (const viewport of viewports) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            for (const route of routes) {
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(`pageerror: ${String(error)}`));
              const response = await page.goto(base + route, { waitUntil: 'networkidle' });
              const status = response?.status() ?? 0;
              const h1Visible = await page.locator('h1').first().isVisible().catch(() => false);
              const geometry = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
              }));
              const horizontalOverflow = geometry.scrollWidth > geometry.clientWidth + 2;
              if (status !== 200) errors.push(`HTTP ${status}`);
              if (!h1Visible) errors.push('Primary heading is not visible');
              if (horizontalOverflow) errors.push(`Horizontal overflow ${geometry.scrollWidth}/${geometry.clientWidth}`);

              if (route === '/') {
                if (await page.locator('a[href*="decision-frame"]').count() < 1) errors.push('Lens CTA missing');
                if (await page.locator('a[href*="benchmark"]').count() < 1) errors.push('Benchmark CTA missing');
                if (await page.locator('[data-decision-passage]').count() !== 1) errors.push('Decision Passage missing');
                const expected = viewport.name === 'desktop' ? 'desktop' : viewport.name === 'tablet' ? 'tablet' : 'mobile';
                const visibleSvg = await page.locator(`.through-flow__${expected}`).evaluate(el => getComputedStyle(el).display !== 'none').catch(() => false);
                if (!visibleSvg) errors.push(`Expected ${expected} hero composition is not active`);
                await page.waitForTimeout(4300);
              }

              if (route === '/decision-frame/') {
                if (await page.locator('input[type="email"]').count() < 1) errors.push('Lens email input missing');
                if (await page.getByRole('button', { name: /Lens worksheet/i }).count() < 1) errors.push('Lens submit action missing');
              }

              if (route === '/benchmark/') {
                const text = await page.locator('body').innerText();
                if (!/Compass/.test(text)) errors.push('Compass naming missing from benchmark');
                if (!/does not|limit/i.test(text)) errors.push('Benchmark limitation boundary is not visible');
              }

              if (route === '/product/' && !page.url().includes('/benchmark/')) {
                errors.push('/product/ did not resolve to /benchmark/');
              }

              const safeRoute = route === '/' ? 'home' : route.replaceAll('/', '-').replace(/^-|-$/g, '');
              const screenshot = path.join(output, `${safeRoute}-${viewport.name}.png`);
              await page.screenshot({ path: screenshot, fullPage: true });
              const passed = errors.length === 0;
              if (!passed) failed = true;
              results.push({ route, viewport: viewport.name, status, horizontalOverflow, errors, screenshot, passed });
              await page.close();
            }
            await context.close();
          }

          const reduced = await browser.newContext({ viewport: { width: 1440, height: 1000 }, reducedMotion: 'reduce' });
          const reducedPage = await reduced.newPage();
          await reducedPage.goto(base + '/', { waitUntil: 'networkidle' });
          const reducedState = await reducedPage.evaluate(() => {
            const root = document.querySelector('[data-decision-passage]');
            const motion = root?.querySelector('.through-flow__desktop .through-flow__motion');
            const still = root?.querySelector('.through-flow__desktop .through-flow__still');
            return {
              motion: motion ? getComputedStyle(motion).display : 'missing',
              still: still ? getComputedStyle(still).display : 'missing',
            };
          });
          const reducedPassed = reducedState.motion === 'none' && reducedState.still !== 'none';
          if (!reducedPassed) failed = true;
          results.push({ route: '/', viewport: 'desktop-reduced-motion', reducedState, passed: reducedPassed });
          await reduced.close();

          await browser.close();
          fs.writeFileSync(path.join(output, 'report.json'), JSON.stringify({ passed: !failed, results }, null, 2));
          console.log(JSON.stringify({ passed: !failed, results }, null, 2));
          if (failed) process.exit(1);
          EOF
          node qa/launch/run.mjs

      - name: Check internal links
        run: |
          python - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          base='http://127.0.0.1:4321/'
          seeds=['/','/decision-frame/','/benchmark/']
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      href=dict(attrs).get('href')
                      if href:self.links.append(href)
          targets=set()
          for seed in seeds:
              with urllib.request.urlopen(urljoin(base,seed),timeout=10) as r: html=r.read().decode('utf-8','replace')
              p=Links();p.feed(html)
              for href in p.links:
                  parsed=urlparse(urljoin(urljoin(base,seed),href))
                  if parsed.netloc=='127.0.0.1:4321': targets.add(parsed.path or '/')
          failures=[]
          for target in sorted(targets):
              try:
                  with urllib.request.urlopen(urljoin(base,target),timeout=10) as r: status=r.status
                  if status>=400: failures.append((target,status))
              except Exception as exc: failures.append((target,str(exc)))
          if failures: raise SystemExit(f'Broken internal links: {failures}')
          print(f'PASS internal_links={len(targets)}')
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-preview-qa
          path: qa/launch/
          if-no-files-found: warn
          retention-days: 14
